version: '{build}'
image: Visual Studio 2026

branches:
  only:
    - main

skip_tags: true

before_build:
  - ps: .\set-version.ps1

build_script:
  - msbuild WinKill\WinKill.vcxproj /p:Configuration=Release /p:Platform=x64
  - msbuild WinKill.sln /p:Configuration=Release /p:Platform="Any CPU"

artifacts:
  - path: WinKillSetup\Release\*.msi
    name: msi

deploy:
  - provider: GitHub
    tag: $(RELEASE_TAG)
    release: 'WinKill $(RELEASE_TAG)'
    description: 'Automated release from AppVeyor'
    auth_token: $(GH_PAT)
    artifact: WinKillSetup\Release\WinKill.msi
    draft: false
    prerelease: false
    on:
      branch: main
